[general]
live_config_reload = true

import = [
    "~/.config/alacritty/themes/themes/tokyo-night.toml"
]

[window]
opacity = 0.9
padding = { x = 5, y = 5 }

decorations = "None"

dynamic_padding = true

[font]
normal = {family="JetBrainsMono Nerd Font", style="Regular"}
bold = {family="JetBrainsMono Nerd Font", style="Bold"}
italic = {family="JetBrainsMono Nerd Font", style="Italic"}

size = 10

[cursor]
style = "Block"

blink_interval = 500

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[colors.bright]
black = "#444b6a"
blue = "#7da6ff"
cyan = "#0db9d7"
green = "#b9f27c"
magenta = "#bb9af7"
red = "#ff7a93"
white = "#acb0d0"
yellow = "#ff9e64"

[colors.normal]
black = "#32344a"
blue = "#7aa2f7"
cyan = "#449dab"
green = "#9ece6a"
magenta = "#ad8ee6"
red = "#f7768e"
white = "#787c99"
yellow = "#e0af68"

[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"
